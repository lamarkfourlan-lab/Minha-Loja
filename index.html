  <style>
    :root{
      --blue:#2563eb;
      --blue-dark:#1d4ed8;
      --ink:#172033;
      --muted:#6b7280;
      --bg:#f7f8fc;
      --card:#fff;
      --line:#e8ebf2;
      --green:#0f9d6e;
      --red:#d83a56;
      --shadow:0 8px 25px rgba(23,32,51,.06)
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
    }

    button,input,select{font:inherit}

    button{
      border:0;
      cursor:pointer
    }

    .shell{
      max-width:1120px;
      margin:auto;
      padding:24px 18px 48px
    }

    header{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:20px
    }

    .logo{
      width:72px;
      height:72px;
      border:1px solid #dce1eb;
      border-radius:18px;
      background:#fff;
      display:grid;
      place-items:center;
      overflow:hidden;
      cursor:pointer
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .logo span{
      font-size:27px;
      color:var(--blue)
    }

    .brand{
      flex:1
    }

    .brand h1{
      font-size:24px;
      line-height:1.1;
      margin:0 0 4px
    }

    .brand p{
      color:var(--muted);
      margin:0
    }

    .link-btn{
      background:none;
      color:var(--blue);
      padding:0;
      text-decoration:underline
    }

    nav{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
      margin-bottom:22px
    }

    .tab{
      padding:12px 8px;
      border-radius:12px;
      background:#bec6d5;
      color:#fff;
      font-weight:700
    }

    .tab.active{
      background:var(--blue)
    }

    .view{
      display:none
    }

    .view.active{
      display:block
    }

    .section-title{
      font-size:22px;
      margin:0 0 15px
    }

    .sub-title{
      font-size:18px;
      margin:24px 0 12px
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px
    }

    .card,.panel,.row{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow)
    }

    .card{
      padding:16px
    }

    .card small{
      color:var(--muted);
      display:block;
      margin-bottom:8px
    }

    .card strong{
      font-size:21px
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:20px 0 13px
    }

    .primary,.secondary,.danger{
      border-radius:11px;
      padding:12px 16px;
      font-weight:700
    }

    .primary{
      background:var(--blue);
      color:#fff
    }

    .primary:hover{
      background:var(--blue-dark)
    }

    .secondary{
      background:#465670;
      color:#fff
    }

    .danger{
      background:#fff;
      color:var(--red);
      border:1px solid #f0c8d0
    }

    .list{
      display:grid;
      gap:10px
    }

    .row{
      padding:13px 15px;
      display:flex;
      gap:12px;
      align-items:center
    }

    .row-main{
      flex:1;
      min-width:0
    }

    .row-title{
      font-weight:750;
      font-size:16px
    }

    .row-meta{
      color:var(--muted);
      font-size:13px
    }

    .qty{
      font-weight:800;
      white-space:nowrap
    }

    .positive{
      color:var(--green)
    }

    .negative{
      color:var(--red)
    }

    .clickable{
      cursor:pointer
    }

    .empty{
      padding:28px;
      text-align:center;
      color:var(--muted)
    }

    .report{
      padding:20px
    }

    .report h3{
      margin:0 0 12px
    }

    .report p{
      margin:6px 0;
      color:var(--muted)
    }

    .report-line{
      white-space:pre-line
    }

    .receipt{
      max-width:420px;
      margin:0 auto;
      text-align:center
    }

    .receipt h2{
      margin:0 0 3px
    }

    .receipt .muted{
      color:var(--muted)
    }

    .receipt .total{
      font-size:28px;
      font-weight:800;
      margin:18px 0
    }

    .receipt .detail{
      text-align:left;
      background:#f7f8fc;
      border-radius:12px;
      padding:15px;
      margin-top:15px
    }

    .modal-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(23,32,51,.48);
      z-index:10;
      padding:18px;
      overflow:auto
    }

    .modal-backdrop.open{
      display:grid;
      place-items:center
    }

    .modal{
      background:#fff;
      border-radius:18px;
      width:min(100%,520px);
      padding:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.2)
    }
