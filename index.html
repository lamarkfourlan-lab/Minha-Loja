<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestor de estoque, caixa, relatórios e recibos para pequenos negócios.">
  <title>Estoque & Caixa — Gestor da loja</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjggMTI4Ij4KICA8cmVjdCB3aWR0aD0iMTI4IiBoZWlnaHQ9IjEyOCIgcng9IjI4IiBmaWxsPSIjMjU2M0VCIi8+CiAgPHJlY3QgeD0iMjUiIHk9IjI3IiB3aWR0aD0iNzgiIGhlaWdodD0iNzIiIHJ4PSIxMCIgZmlsbD0iI2ZmZiIvPgogIDxwYXRoIGQ9Ik0zNSA0Nmg1OE0zNSA2M2g1OE0zNSA4MGgzNCIgc3Ryb2tlPSIjMjU2M0VCIiBzdHJva2Utd2lkdGg9IjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgogIDxjaXJjbGUgY3g9Ijg2IiBjeT0iODIiIHI9IjE0IiBmaWxsPSIjMEY5RDZFIi8+CiAgPHBhdGggZD0ibTc5IDgyIDUgNSA5LTExIiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo="
  >

  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --ink: #172033;
      --muted: #6b7280;
      --bg: #f7f8fc;
      --card: #ffffff;
      --line: #e8ebf2;
      --green: #0f9d6e;
      --red: #d83a56;
      --shadow: 0 8px 25px rgba(23, 32, 51, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      max-width: 1120px;
      margin: auto;
      padding: 24px 18px 48px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border: 1px solid #dce1eb;
      border-radius: 18px;
      background: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo span {
      font-size: 27px;
      color: var(--blue);
    }

    .brand {
      flex: 1;
    }

    .brand h1 {
      font-size: 24px;
      line-height: 1.1;
      margin: 0 0 4px;
    }

    .brand p {
      color: var(--muted);
      margin: 0;
    }

    .link-btn {
      background: none;
      color: var(--blue);
      padding: 0;
      text-decoration: underline;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab {
      padding: 12px 8px;
      border-radius: 12px;
      background: #bec6d5;
      color: #fff;
      font-weight: 700;
    }

    .tab.active {
      background: var(--blue);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .section-title {
      font-size: 22px;
      margin: 0 0 15px;
    }

    .sub-title {
      font-size: 18px;
      margin: 24px 0 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card,
    .panel,
    .row {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .card {
      padding: 16px;
    }

    .card small {
      color: var(--muted);
      display: block;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 21px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 13px;
    }

    .primary,
    .secondary,
    .danger {
      border-radius: 11px;
      padding: 12px 16px;
      font-weight: 700;
    }

    .primary {
      background: var(--blue);
      color: #fff;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      background: #465670;
      color: #fff;
    }

    .danger {
      background: #fff;
      color: var(--red);
      border: 1px solid #f0c8d0;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      padding: 13px 15px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-weight: 750;
      font-size: 16px;
    }

    .row-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .qty {
      font-weight: 800;
      white-space: nowrap;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }

    .clickable {
      cursor: pointer;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .report {
      padding: 20px;
    }

    .report h3 {
      margin: 0 0 12px;
    }

    .report p {
      margin: 6px 0;
      color: var(--muted);
    }

    .report-line {
      white-space: pre-line;
    }

    .receipt {
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    .receipt h2 {
      margin: 0 0 3px;
    }

    .receipt .muted {
      color: var(--muted);
    }

    .receipt .total {
      font-size: 28px;
      font-weight: 800;
      margin: 18px 0;
    }

    .receipt .detail {
      text-align: left;
      background: #f7f8fc;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(23, 32, 51, .48);
      z-index: 10;
      padding: 18px;
      overflow: auto;
    }

    .modal-backdrop.open {
      display: grid;
      place-items: center;
    }

    .modal {
      background: #fff;
      border-radius: 18px;
      width: min(100%, 520px);
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }

    .modal h2 {
      margin: 0 0 15px;
    }

    .modal label {
      display: block;
      font-weight: 700;
      margin: 11px 0 5px;
    }

    .modal input,
    .modal select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dbe1eb;
      border-radius: 10px;
      background: #fff;
    }

    .scan-tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .scan-tools input {
      flex: 1;
    }

    .scan-tools button {
      white-space: nowrap;
      padding: 10px 12px;
      border-radius: 10px;
      background: #465670;
      color: #fff;
    }

    .scanner-video {
      width: 100%;
      max-height: 300px;
      min-height: 190px;
      object-fit: cover;
      border-radius: 14px;
      background: #111;
      margin: 6px 0 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .shell {
        padding: 18px 12px 40px;
      }

      header {
        align-items: flex-start;
      }

      .logo {
        width: 62px;
        height: 62px;
      }

      .brand h1 {
        font-size: 20px;
      }

      nav {
        gap: 5px;
      }

      .tab {
        font-size: 12px;
        padding: 11px 4px;
      }

      .row {
        align-items: flex-start;
      }

      .row .primary {
        padding: 9px 10px;
        font-size: 12px;
      }
    }

    @media (max-width: 430px) {
      .cards {
        gap: 8px;
      }

      .card {
        padding: 12px;
      }

      .card strong {
        font-size: 17px;
      }

      .row {
        padding: 12px;
        flex-wrap: wrap;
      }

      .row > button {
        width: 100%;
      }

      .row-main {
        flex-basis: calc(100% - 70px);
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .shell {
        max-width: none;
        padding: 0;
      }

      header,
      nav,
      .toolbar,
      #view-stock,
      #view-cash {
        display: none !important;
      }

      #view-reports {
        display: block;
      }

      .panel,
      .card {
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header>
      <label class="logo" title="Escolher logo">
        <input id="logoInput" type="file" accept="image/*" hidden>
        <img id="logoImage" alt="Logo da loja" hidden>
        <span id="logoPlaceholder">⌂</span>
      </label>

      <div class="brand">
        <h1 id="storeName">Minha Loja</h1>

        <p>
          Gestor de estoque e caixa ·
          <button class="link-btn" id="editStore">
            editar nome
          </button>
        </p>
      </div>
    </header>

    <nav aria-label="Navegação principal">
      <button class="tab active" data-view="dashboard">
        Visão geral
      </button>

      <button class="tab" data-view="stock">
        Estoque
      </button>

      <button class="tab" data-view="cash">
        Caixa
      </button>

      <button class="tab" data-view="clients">
        Clientes
      </button>

      <button class="tab" data-view="reports">
        Relatórios
      </button>
    </nav>

    <section id="view-dashboard" class="view active">
      <h2 class="section-title">Visão geral</h2>

      <div class="cards" id="dashboardCards"></div>

      <div class="toolbar">
        <button class="primary" data-action="new-product">
          + Adicionar produto
        </button>

        <button class="secondary" data-action="new-sale">
          📷 Registrar venda
        </button>

        <button class="secondary" data-action="new-cash">
          + Registrar lançamento
        </button>

        <button class="secondary" data-action="new-client">
          + Cadastrar cliente
        </button>
      </div>

      <div class="panel report">
        <h3>Comece pela sua operação</h3>

        <p>
          Cadastre seus produtos no estoque e registre entradas e saídas no caixa.
          Tudo fica salvo neste navegador.
        </p>
      </div>
    </section>

    <section id="view-stock" class="view">
      <h2 class="section-title">Estoque</h2>

      <div class="cards" id="stockCards"></div>

      <div class="toolbar">
        <button class="primary" data-action="new-product">
          + Adicionar produto
        </button>
      </div>

      <div class="list" id="productList"></div>
    </section>

    <section id="view-cash" class="view">
      <h2 class="section-title">Caixa</h2>

      <div class="cards" id="cashCards"></div>

      <div class="toolbar">
        <button class="primary" data-action="new-sale">
          📷 Registrar venda
        </button>

        <button class="secondary" data-action="new-cash">
          + Registrar lançamento
        </button>
      </div>

      <div class="list" id="cashList"></div>

      <p class="hint">
        Toque em um lançamento para abrir o recibo com o nome da loja.
      </p>
    </section>

    <section id="view-clients" class="view">
      <h2 class="section-title">Clientes</h2>

      <div class="cards" id="clientCards"></div>

      <div class="toolbar">
        <button class="primary" data-action="new-client">
          + Cadastrar cliente
        </button>
      </div>

      <div class="list" id="clientList"></div>
    </section>

    <section id="view-reports" class="view">
      <h2 class="section-title">Relatórios</h2>

      <div class="panel report" id="reportContent"></div>

      <div class="toolbar">
        <button class="secondary" id="printReport">
          Imprimir relatório
        </button>

        <button class="primary" id="lastReceipt">
          Ver último recibo
        </button>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <div class="modal-backdrop" id="scannerBackdrop">
    <div class="modal" id="scannerModal"></div>
  </div>

  <script>
    const KEY = 'estoque_caixa_html_v1';

    const money = new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });

    const defaultState = {
      storeName: 'Minha Loja',
      logo: '',
      products: [],
      cash: [],
      customers: []
    };

    let state = load();

    function load() {
      try {
        return {
          ...defaultState,
          ...JSON.parse(localStorage.getItem(KEY) || '{}')
        };
      } catch (error) {
        return {
          ...defaultState
        };
      }
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
      render();
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));
    }

    function val(value) {
      return Number(value || 0);
    }

    function totals() {
      let units = 0;
      let stock = 0;
      let balance = 0;
      let income = 0;
      let expense = 0;

      state.products.forEach(product => {
        units += val(product.qty);
        stock += val(product.qty) * val(product.cost);
      });

      state.cash.forEach(entry => {
        if (entry.type === 'IN') {
          balance += val(entry.amount);
          income += val(entry.amount);
        } else {
          balance -= val(entry.amount);
          expense += val(entry.amount);
        }
      });

      return {
        units,
        stock,
        balance,
        income,
        expense
      };
    }

    function cards(items) {
      return items.map(item => `
        <div class="card">
          <small>${item[0]}</small>
          <strong class="${item[2] || ''}">
            ${item[1]}
          </strong>
        </div>
      `).join('');
    }

    function render() {
      document.getElementById('storeName').textContent =
        state.storeName || 'Minha Loja';

      const image = document.getElementById('logoImage');
      const placeholder = document.getElementById('logoPlaceholder');

      if (state.logo) {
        image.src = state.logo;
        image.hidden = false;
        placeholder.hidden = true;
      } else {
        image.hidden = true;
        placeholder.hidden = false;
      }

      const total = totals();

      document.getElementById('dashboardCards').innerHTML = cards([
        [
          'Quantidade em estoque',
          total.units
        ],
        [
          'Valor do estoque',
          money.format(total.stock),
          'positive'
        ],
        [
          'Saldo do caixa',
          money.format(total.balance),
          total.balance >= 0 ? 'positive' : 'negative'
        ],
        [
          'Lançamentos',
          state.cash.length
        ]
      ]);

      document.getElementById('stockCards').innerHTML = cards([
        [
          'Quantidade em estoque',
          total.units
        ],
        [
          'Valor investido',
          money.format(total.stock),
          'positive'
        ]
      ]);

      document.getElementById('cashCards').innerHTML = cards([
        [
          'Saldo',
          money.format(total.balance),
          total.balance >= 0 ? 'positive' : 'negative'
        ],
        [
          'Entradas',
          money.format(total.income),
          'positive'
        ],
        [
          'Saídas',
          money.format(total.expense),
          'negative'
        ],
        [
          'Lançamentos',
          state.cash.length
        ]
      ]);

      document.getElementById('productList').innerHTML =
        state.products.length
          ? state.products.map((product, index) => `
            <div class="row">
              <div class="row-main">
                <div class="row-title">
                  ${esc(product.name)}
                </div>

                <div class="row-meta">
                  Venda: ${money.format(val(product.price))}
                  · Custo: ${money.format(val(product.cost))}
                </div>
              </div>

              <div class="qty ${
                val(product.qty) <= 2 ? 'negative' : 'positive'
              }">
                ${val(product.qty)} un.
              </div>

              <button class="secondary" data-move="${index}">
                Movimentar
              </button>
            </div>
          `).join('')
          : `
            <div class="panel empty">
              Seu estoque está vazio.<br>
              Cadastre o primeiro produto para começar.
            </div>
          `;

      document.getElementById('cashList').innerHTML =
        state.cash.length
          ? state.cash
              .slice()
              .reverse()
              .map((entry, reverseIndex) => {
                const index =
                  state.cash.length - 1 - reverseIndex;

                return `
                  <div class="row clickable" data-receipt="${index}">
                    <div class="row-main">
                      <div class="row-title">
                        ${esc(entry.description)}
                      </div>

                      <div class="row-meta">
                        ${esc(entry.date)}
                        ${
                          entry.customer
                            ? ' · Cliente: ' + esc(entry.customer)
                            : ''
                        }
                        · toque para ver o recibo
                      </div>
                    </div>

                    <div class="qty ${
                      entry.type === 'IN'
                        ? 'positive'
                        : 'negative'
                    }">
                      ${entry.type === 'IN' ? '+' : '-'}
                      ${money.format(val(entry.amount))}
                    </div>
                  </div>
                `;
              })
              .join('')
          : `
            <div class="panel empty">
              Nenhum lançamento.<br>
              Registre vendas, recebimentos ou despesas.
            </div>
          `;

      document.getElementById('clientCards').innerHTML = cards([
        [
          'Clientes cadastrados',
          state.customers.length
        ],
        [
          'Com telefone',
          state.customers.filter(customer => customer.phone).length
        ]
      ]);

      document.getElementById('clientList').innerHTML =
        state.customers.length
          ? state.customers.map((customer, index) => `
            <div class="row">
              <div class="row-main">
                <div class="row-title">
                  ${esc(customer.name)}
                </div>

                <div class="row-meta">
                  ${
                    customer.phone
                      ? esc(customer.phone)
                      : 'Sem telefone'
                  }

                  ${
                    customer.email
                      ? ' · ' + esc(customer.email)
                      : ''
                  }

                  ${
                    customer.address
                      ? ' · ' + esc(customer.address)
                      : ''
                  }
                </div>
              </div>

              <button
                class="danger"
                data-delete-client="${index}">
                Excluir
              </button>
            </div>
          `).join('')
          : `
            <div class="panel empty">
              Nenhum cliente cadastrado.<br>
              Cadastre clientes para vincular às vendas.
            </div>
          `;

      document.getElementById('reportContent').innerHTML = `
        <h3>${esc(state.storeName || 'Minha Loja')}</h3>

        <p>Relatório de estoque e caixa</p>

        <h3 class="sub-title">
          Resumo financeiro
        </h3>

        <p>
          Entradas:
          <b>${money.format(total.income)}</b>
        </p>

        <p>
          Saídas:
          <b>${money.format(total.expense)}</b>
        </p>

        <p>
          Saldo:
          <b class="${
            total.balance >= 0 ? 'positive' : 'negative'
          }">
            ${money.format(total.balance)}
          </b>
        </p>

        <h3 class="sub-title">
          Resumo do estoque
        </h3>

        <p>
          Quantidade em estoque:
          <b>${total.units}</b>
        </p>

        <p>
          Valor do estoque:
          <b>${money.format(total.stock)}</b>
        </p>

        <p>
          Produtos cadastrados:
          <b>${state.products.length}</b>
        </p>

        <p>
          Clientes cadastrados:
          <b>${state.customers.length}</b>
        </p>

        ${
          state.products.length
            ? `
              <div class="report-line">
                ${state.products.map(product =>
                  `• \({esc(product.name)}: \){val(product.qty)} unidade(s)`
                ).join('\n')}
              </div>
            `
            : ''
        }
      `;

      document.getElementById('lastReceipt').style.display =
        state.cash.length ? 'inline-block' : 'none';
    }

    function openModal(html) {
      document.getElementById('modal').innerHTML = html;
      document
        .getElementById('modalBackdrop')
        .classList.add('open');
    }

    let scannerStream = null;
    let scannerTarget = null;
    let scannerFrame = 0;

    function closeModal() {
      closeScanner();

      document
        .getElementById('modalBackdrop')
        .classList.remove('open');
    }

    function closeScanner() {
      stopScanner();
      scannerTarget = null;

      document
        .getElementById('scannerBackdrop')
        .classList.remove('open');
    }

    function stopScanner() {
      if (scannerFrame) {
        cancelAnimationFrame(scannerFrame);
      }

      scannerFrame = 0;

      if (scannerStream) {
        scannerStream
          .getTracks()
          .forEach(track => track.stop());

        scannerStream = null;
      }
    }

    function finishScan(code) {
      const target = scannerTarget;

      if (target) {
        target.value = code;

        target.dispatchEvent(new Event('input', {
          bubbles: true
        }));
      }

      closeScanner();
    }

    async function scanInto(target) {
      scannerTarget = target;

      document.getElementById('scannerModal').innerHTML = `
        <h2>Ler código de barras</h2>

        <video
          id="scannerVideo"
          class="scanner-video"
          autoplay
          muted
          playsinline>
        </video>

        <p class="hint" id="scanStatus">
          Aponte a câmera para o código de barras.
        </p>

        <label>
          Ou digite o código

          <input
            id="manualBarcode"
            inputmode="numeric"
            placeholder="Ex.: 7890000000000">
        </label>

        <div class="modal-actions">
          <button
            type="button"
            class="danger"
            data-close-scanner>
            Cancelar
          </button>

          <button
            type="button"
            class="primary"
            id="useManual">
            Usar código
          </button>
        </div>
      `;

      document
        .getElementById('scannerBackdrop')
        .classList.add('open');

      document.getElementById('useManual').onclick = () => {
        const code = document
          .getElementById('manualBarcode')
          .value
          .trim();

        if (code) {
          finishScan(code);
        }
      };

      const status = document.getElementById('scanStatus');
      const video = document.getElementById('scannerVideo');

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        status.textContent =
          'Seu navegador não liberou acesso à câmera. Digite o código manualmente.';
        return;
      }

      if (!('BarcodeDetector' in window)) {
        status.textContent =
          'A leitura automática não está disponível neste navegador. Digite o código ou abra no Chrome atualizado do celular.';
        return;
      }

      try {
        scannerStream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: 'environment'
              }
            },
            audio: false
          });

        video.srcObject = scannerStream;
        await video.play();

        const detector = new BarcodeDetector();

        const detect = async () => {
          if (!scannerStream) {
            return;
          }

          try {
            const found = await detector.detect(video);

            if (
              found.length &&
              found[0].rawValue
            ) {
              finishScan(found[0].rawValue);
              return;
            }
          } catch (error) {}

          scannerFrame =
            requestAnimationFrame(detect);
        };

        detect();
      } catch (error) {
        status.textContent =
          'Não foi possível abrir a câmera. Verifique a permissão ou digite o código manualmente.';
      }
    }

    function newProduct() {
      openModal(`
        <h2>Novo produto</h2>

        <form id="productForm">
          <label>
            Nome do produto
            <input name="name" required>
          </label>

          <label>
            Código de barras / SKU
            <span class="hint">(opcional)</span>

            <div class="scan-tools">
              <input name="sku" id="productSku">

              <button
                type="button"
                id="scanProduct">
                📷 Ler câmera
              </button>
            </div>
          </label>

          <label>
            Quantidade inicial

            <input
              name="qty"
              type="number"
              min="0"
              value="0"
              required>
          </label>

          <label>
            Custo unitário (R$)

            <input
              name="cost"
              type="number"
              min="0"
              step="0.01"
              value="0">
          </label>

          <label>
            Preço de venda (R$)

            <input
              name="price"
              type="number"
              min="0"
              step="0.01"
              value="0">
          </label>

          <div class="modal-actions">
            <button
              type="button"
              class="danger"
              data-close>
              Cancelar
            </button>

            <button class="primary">
              Salvar
            </button>
          </div>
        </form>
      `);

      document.getElementById('scanProduct').onclick =
        () => scanInto(
          document.getElementById('productSku')
        );

      document.getElementById('productForm').onsubmit =
        event => {
          event.preventDefault();

          const form = new FormData(event.target);

          state.products.push({
            name: form.get('name').trim(),
            sku: form.get('sku').trim(),
            qty: val(form.get('qty')),
            cost: val(form.get('cost')),
            price: val(form.get('price'))
          });

          save();
          closeModal();
        };
    }

    function newSale() {
      if (!state.products.length) {
        alert(
          'Cadastre um produto antes de registrar uma venda.'
        );
        return;
      }

      const productOptions = state.products
        .map((product, index) => `
          <option value="${index}">
            ${esc(product.name)}
            · ${product.qty} un.
            · ${money.format(val(product.price))}
          </option>
        `)
        .join('');

      const clientOptions =
        '<option value="">Venda sem cliente</option>' +
        state.customers
          .map((customer, index) => `
            <option value="${index}">
              ${esc(customer.name)}
              ${
                customer.phone
                  ? ' · ' + esc(customer.phone)
                  : ''
              }
            </option>
          `)
          .join('');

      openModal(`
        <h2>Registrar venda</h2>

        <form id="saleForm">
          <label>
            Código de barras

            <div class="scan-tools">
              <input
                name="barcode"
                id="saleBarcode"
                placeholder="Digite ou leia com a câmera">

              <button
                type="button"
                id="scanSale">
                📷 Ler câmera
              </button>
            </div>
          </label>

          <label>
            Produto

            <select
              name="productIndex"
              id="saleProduct">
              ${productOptions}
            </select>
          </label>

          <label>
            Cliente
            <span class="hint">(opcional)</span>

            <select
              name="clientIndex"
              id="saleClient">
              ${clientOptions}
            </select>
          </label>

          <label>
            Quantidade

            <input
              name="qty"
              type="number"
              min="1"
              value="1"
              required>
          </label>

          <p class="hint" id="saleHint">
            Leia o código para localizar o produto automaticamente.
          </p>

          <div class="modal-actions">
            <button
              type="button"
              class="danger"
              data-close>
              Cancelar
            </button>

            <button class="primary">
              Finalizar venda
            </button>
          </div>
        </form>
      `);

      const barcode =
        document.getElementById('saleBarcode');

      const select =
        document.getElementById('saleProduct');

      const matchProduct = () => {
        const productIndex =
          state.products.findIndex(product =>
            product.sku &&
            product.sku === barcode.value.trim()
          );

        if (productIndex >= 0) {
          select.value = productIndex;

          document.getElementById('saleHint').textContent =
            'Produto localizado: ' +
            state.products[productIndex].name;
        } else if (barcode.value.trim()) {
          document.getElementById('saleHint').textContent =
            'Código não encontrado; escolha o produto manualmente.';
        }
      };

      barcode.addEventListener(
        'input',
        matchProduct
      );

      document.getElementById('scanSale').onclick =
        () => scanInto(barcode);

      document.getElementById('saleForm').onsubmit =
        event => {
          event.preventDefault();

          const form = new FormData(event.target);

          const product =
            state.products[
              Number(form.get('productIndex'))
            ];

          const quantity =
            val(form.get('qty'));

          const clientIndex =
            form.get('clientIndex');

          const client =
            clientIndex === ''
              ? null
              : state.customers[
                  Number(clientIndex)
                ];

          if (
            quantity < 1 ||
            quantity > product.qty
          ) {
            alert(
              'Quantidade maior que o estoque disponível.'
            );
            return;
          }

          product.qty -= quantity;

          state.cash.push({
            type: 'IN',
            description:
              'Venda: ' +
              product.name +
              ' (' +
              quantity +
              ' un.)',
            amount:
              val(product.price) * quantity,
            date:
              new Date().toLocaleString('pt-BR'),
            barcode:
              product.sku || '',
            customer:
              client ? client.name : ''
          });

          save();
          closeModal();
          receipt(state.cash.length - 1);
        };
    }

    function moveStock(index) {
      const product = state.products[index];

      openModal(`
        <h2>Movimentar estoque</h2>

        <p class="hint">
          ${esc(product.name)}
          · estoque atual: ${product.qty}
        </p>

        <form id="moveForm">
          <label>
            Tipo

            <select name="type">
              <option value="IN">
                Entrada
              </option>

              <option value="OUT">
                Saída
              </option>
            </select>
          </label>

          <label>
            Quantidade

            <input
              name="qty"
              type="number"
              min="1"
              value="1"
              required>
          </label>

          <div class="modal-actions">
            <button
              type="button"
              class="danger"
              data-close>
              Cancelar
            </button>

            <button class="primary">
              Aplicar
            </button>
          </div>
        </form>
      `);

      document.getElementById('moveForm').onsubmit =
        event => {
          event.preventDefault();

          const form = new FormData(event.target);
          const quantity =
            val(form.get('qty'));

          if (
            form.get('type') === 'OUT' &&
            quantity > product.qty
          ) {
            alert(
              'A saída não pode ser maior que o estoque.'
            );
            return;
          }

          product.qty +=
            form.get('type') === 'IN'
              ? quantity
              : -quantity;

          save();
          closeModal();
        };
    }

    function newClient() {
      openModal(`
        <h2>Novo cliente</h2>

        <form id="clientForm">
          <label>
            Nome completo
            <input name="name" required>
          </label>

          <label>
            Telefone / WhatsApp

            <input
              name="phone"
              type="tel"
              placeholder="(00) 00000-0000">
          </label>

          <label>
            E-mail
            <input name="email" type="email">
          </label>

          <label>
            Endereço
            <input name="address">
          </label>

          <div class="modal-actions">
            <button
              type="button"
              class="danger"
              data-close>
              Cancelar
            </button>

            <button class="primary">
              Salvar cliente
            </button>
          </div>
        </form>
      `);

      document.getElementById('clientForm').onsubmit =
        event => {
          event.preventDefault();

          const form = new FormData(event.target);

          state.customers.push({
            name: form.get('name').trim(),
            phone: form.get('phone').trim(),
            email: form.get('email').trim(),
            address: form.get('address').trim()
          });

          save();
          closeModal();
        };
    }

    function newCash() {
      openModal(`
        <h2>Novo lançamento</h2>

        <form id="cashForm">
          <label>
            Tipo

            <select name="type">
              <option value="IN">
                Entrada
              </option>

              <option value="OUT">
                Saída
              </option>
            </select>
          </label>

          <label>
            Descrição

            <input
              name="description"
              placeholder="Ex.: Venda no balcão"
              required>
          </label>

          <label>
            Valor (R$)

            <input
              name="amount"
              type="number"
              min="0.01"
              step="0.01"
              required>
          </label>

          <div class="modal-actions">
            <button
              type="button"
              class="danger"
              data-close>
              Cancelar
            </button>

            <button class="primary">
              Salvar
            </button>
          </div>
        </form>
      `);

      document.getElementById('cashForm').onsubmit =
        event => {
          event.preventDefault();

          const form = new FormData(event.target);

          state.cash.push({
            type: form.get('type'),
            description:
              form.get('description').trim(),
            amount:
              val(form.get('amount')),
            date:
              new Date().toLocaleString('pt-BR')
          });

          save();
          closeModal();
        };
    }

    function receipt(index) {
      const entry = state.cash[index];

      if (!entry) {
        return;
      }

      const isInput = entry.type === 'IN';

      openModal(`
        <div class="receipt">
          <h2>
            ${esc(state.storeName || 'Minha Loja')}
          </h2>

          <div class="muted">
            RECIBO DE LANÇAMENTO
          </div>

          <hr>

          <div class="detail">
            <b>Descrição:</b>
            ${esc(entry.description)}
            <br>

            ${
              entry.customer
                ? '<b>Cliente:</b> ' +
                  esc(entry.customer) +
                  '<br>'
                : ''
            }

            <b>Tipo:</b>
            ${isInput ? 'Entrada' : 'Saída'}
            <br>

            <b>Data:</b>
            ${esc(entry.date)}
          </div>

          <div class="total ${
            isInput ? 'positive' : 'negative'
          }">
            ${isInput ? '+' : '-'}
            ${money.format(val(entry.amount))}
          </div>

          <div class="muted">
            Obrigado!
          </div>

          <div class="modal-actions">
            <button
              class="secondary"
              id="printReceipt">
              Imprimir
            </button>

            <button
              class="primary"
              data-close>
              Fechar
            </button>
          </div>
        </div>
      `);

      document.getElementById('printReceipt').onclick =
        () => window.print();
    }

    document.addEventListener('click', event => {
      const view = event.target.dataset.view;

      if (view) {
        document
          .querySelectorAll('.tab')
          .forEach(button =>
            button.classList.toggle(
              'active',
              button.dataset.view === view
            )
          );

        document
          .querySelectorAll('.view')
          .forEach(viewElement =>
            viewElement.classList.toggle(
              'active',
              viewElement.id === 'view-' + view
            )
          );
      }

      if (
        event.target.matches(
          '[data-action="new-product"]'
        )
      ) {
        newProduct();
      }

      if (
        event.target.matches(
          '[data-action="new-sale"]'
        )
      ) {
        newSale();
      }

      if (
        event.target.matches(
          '[data-action="new-cash"]'
        )
      ) {
        newCash();
      }

      if (
        event.target.matches(
          '[data-action="new-client"]'
        )
      ) {
        newClient();
      }

      if (event.target.matches('[data-close]')) {
        closeModal();
      }

      if (
        event.target.matches(
          '[data-close-scanner]'
        )
      ) {
        closeScanner();
      }

      if (
        event.target.dataset.deleteClient !== undefined
      ) {
        if (confirm('Excluir este cliente?')) {
          state.customers.splice(
            Number(event.target.dataset.deleteClient),
            1
          );

          save();
        }
      }

      if (event.target.dataset.move !== undefined) {
        moveStock(
          Number(event.target.dataset.move)
        );
      }

      if (event.target.closest('[data-receipt]')) {
        receipt(
          Number(
            event.target
              .closest('[data-receipt]')
              .dataset.receipt
          )
        );
      }
    });

    document
      .getElementById('modalBackdrop')
      .addEventListener('click', event => {
        if (event.target.id === 'modalBackdrop') {
          closeModal();
        }
      });

    document
      .getElementById('scannerBackdrop')
      .addEventListener('click', event => {
        if (event.target.id === 'scannerBackdrop') {
          closeScanner();
        }
      });

    document.getElementById('editStore').onclick =
      () => {
        const name = prompt(
          'Nome da loja:',
          state.storeName || 'Minha Loja'
        );

        if (name && name.trim()) {
          state.storeName = name.trim();
          save();
        }
      };

    document.getElementById('logoInput').onchange =
      event => {
        const file = event.target.files[0];

        if (!file) {
          return;
        }

        const reader = new FileReader();

        reader.onload = () => {
          state.logo = reader.result;
          save();
        };

        reader.readAsDataURL(file);
      };

    document.getElementById('printReport').onclick =
      () => window.print();

    document.getElementById('lastReceipt').onclick =
      () => receipt(state.cash.length - 1);

    render();
  </script>
</body>
</html>
