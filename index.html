<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestor de estoque, caixa, relatórios e recibos para pequenos negócios.">
  <title>Estoque & Caixa — Gestor da loja</title>
  <style>
    :root{--blue:#2563eb;--blue-dark:#1d4ed8;--ink:#172033;--muted:#6b7280;--bg:#f7f8fc;--card:#fff;--line:#e8ebf2;--green:#0f9d6e;--red:#d83a56;--shadow:0 8px 25px rgba(23,32,51,.06)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    button,input,select{font:inherit} button{border:0;cursor:pointer}.shell{max-width:1120px;margin:auto;padding:24px 18px 48px}
    header{display:flex;align-items:center;gap:14px;margin-bottom:20px}.logo{width:72px;height:72px;border:1px solid #dce1eb;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}.logo img{width:100%;height:100%;object-fit:cover}.logo span{font-size:27px;color:var(--blue)}
    .brand{flex:1}.brand h1{font-size:24px;line-height:1.1;margin:0 0 4px}.brand p{color:var(--muted);margin:0}.link-btn{background:none;color:var(--blue);padding:0;text-decoration:underline}
    nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}.tab{padding:12px 8px;border-radius:12px;background:#bec6d5;color:#fff;font-weight:700}.tab.active{background:var(--blue)}
    .view{display:none}.view.active{display:block}.section-title{font-size:22px;margin:0 0 15px}.sub-title{font-size:18px;margin:24px 0 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel,.row{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:16px}.card small{color:var(--muted);display:block;margin-bottom:8px}.card strong{font-size:21px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 13px}.primary,.secondary,.danger{border-radius:11px;padding:12px 16px;font-weight:700}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#465670;color:#fff}.danger{background:#fff;color:var(--red);border:1px solid #f0c8d0}
    .list{display:grid;gap:10px}.row{padding:13px 15px;display:flex;gap:12px;align-items:center}.row-main{flex:1;min-width:0}.row-title{font-weight:750;font-size:16px}.row-meta{color:var(--muted);font-size:13px}.qty{font-weight:800;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}.clickable{cursor:pointer}.empty{padding:28px;text-align:center;color:var(--muted)}
    .report{padding:20px}.report h3{margin:0 0 12px}.report p{margin:6px 0;color:var(--muted)}.report-line{white-space:pre-line}.receipt{max-width:420px;margin:0 auto;text-align:center}.receipt h2{margin:0 0 3px}.receipt .muted{color:var(--muted)}.receipt .total{font-size:28px;font-weight:800;margin:18px 0}.receipt .detail{text-align:left;background:#f7f8fc;border-radius:12px;padding:15px;margin-top:15px}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(23,32,51,.48);z-index:10;padding:18px;overflow:auto}.modal-backdrop.open{display:grid;place-items:center}.modal{background:#fff;border-radius:18px;width:min(100%,520px);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin:0 0 15px}.modal label{display:block;font-weight:700;margin:11px 0 5px}.modal input,.modal select{width:100%;padding:11px 12px;border:1px solid #dbe1eb;border-radius:10px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hint{font-size:13px;color:var(--muted)}
    @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.shell{padding:18px 12px 40px}header{align-items:flex-start}.logo{width:62px;height:62px}.brand h1{font-size:20px}nav{gap:5px}.tab{font-size:12px;padding:11px 4px}.row{align-items:flex-start}.row .primary{padding:9px 10px;font-size:12px}}
    @media(max-width:430px){.cards{gap:8px}.card{padding:12px}.card strong{font-size:17px}.row{padding:12px}.row>button{width:100%}.row{flex-wrap:wrap}.row-main{flex-basis:calc(100% - 70px)}}
    @media print{body{background:#fff}.shell{max-width:none;padding:0}header,nav,.toolbar,#view-stock,#view-cash{display:none!important}#view-reports{display:block}.panel,.card{box-shadow:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <label class="logo" title="Escolher logo">
        <input id="logoInput" type="file" accept="image/*" hidden>
        <img id="logoImage" alt="Logo da loja" hidden>
        <span id="logoPlaceholder">⌂</span>
      </label>
      <div class="brand">
        <h1 id="storeName">Minha Loja</h1>
        <p>Gestor de estoque e caixa · <button class="link-btn" id="editStore">editar nome</button></p>
      </div>
    </header>

    <nav aria-label="Navegação principal">
      <button class="tab active" data-view="dashboard">Visão geral</button>
      <button class="tab" data-view="stock">Estoque</button>
      <button class="tab" data-view="cash">Caixa</button>
      <button class="tab" data-view="reports">Relatórios</button>
    </nav>

    <section id="view-dashboard" class="view active">
      <h2 class="section-title">Visão geral</h2>
      <div class="cards" id="dashboardCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-product">+ Adicionar produto</button><button class="secondary" data-action="new-cash">+ Registrar lançamento</button></div>
      <div class="panel report"><h3>Comece pela sua operação</h3><p>Cadastre seus produtos no estoque e registre entradas e saídas no caixa. Tudo fica salvo neste navegador.</p></div>
    </section>

    <section id="view-stock" class="view">
      <h2 class="section-title">Estoque</h2>
      <div class="cards" id="stockCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-product">+ Adicionar produto</button></div>
      <div class="list" id="productList"></div>
    </section>

    <section id="view-cash" class="view">
      <h2 class="section-title">Caixa</h2>
      <div class="cards" id="cashCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-cash">+ Registrar lançamento</button></div>
      <div class="list" id="cashList"></div>
      <p class="hint">Toque em um lançamento para abrir o recibo com o nome da loja.</p>
    </section>

    <section id="view-reports" class="view">
      <h2 class="section-title">Relatórios</h2>
      <div class="panel report" id="reportContent"></div>
      <div class="toolbar"><button class="secondary" id="printReport">Imprimir relatório</button><button class="primary" id="lastReceipt">Ver último recibo</button></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>

  <script>
    const KEY='estoque_caixa_html_v1';
    const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
    const defaultState={storeName:'Minha Loja',logo:'',products:[],cash:[]};
    let state=load();
    function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaultState}}}
    function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
    function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function val(v){return Number(v||0)}
    function totals(){let units=0,stock=0,balance=0,income=0,expense=0;state.products.forEach(p=>{units+=val(p.qty);stock+=val(p.qty)*val(p.cost)});state.cash.forEach(c=>{if(c.type==='IN'){balance+=val(c.amount);income+=val(c.amount)}else{balance-=val(c.amount);expense+=val(c.amount)}});return {units,stock,balance,income,expense}}
    function cards(items){return items.map(x=>`<div class="card"><small>${x[0]}</small><strong class="${x[2]||''}">${x[1]}</strong></div>`).join('')}
    function render(){
      document.getElementById('storeName').textContent=state.storeName||'Minha Loja';
      const img=document.getElementById('logoImage'),ph=document.getElementById('logoPlaceholder');
      if(state.logo){img.src=state.logo;img.hidden=false;ph.hidden=true}else{img.hidden=true;ph.hidden=false}
      const t=totals();
      document.getElementById('dashboardCards').innerHTML=cards([['Unidades em estoque',t.units],['Valor do estoque',money.format(t.stock),'positive'],['Saldo do caixa',money.format(t.balance),t.balance>=0?'positive':'negative'],['Lançamentos',state.cash.length]]);
      document.getElementById('stockCards').innerHTML=cards([['Unidades',t.units],['Valor investido',money.format(t.stock),'positive']]);
      document.getElementById('cashCards').innerHTML=cards([['Saldo',money.format(t.balance),t.balance>=0?'positive':'negative'],['Entradas',money.format(t.income),'positive'],['Saídas',money.format(t.expense),'negative'],['Lançamentos',state.cash.length]]);
      document.getElementById('productList').innerHTML=state.products.length?state.products.map((p,i)=>`<div class="row"><div class="row-main"><div class="row-title">${esc(p.name)}</div><div class="row-meta">Venda: ${money.format(val(p.price))} · Custo: ${money.format(val(p.cost))}</div></div><div class="qty ${val(p.qty)<=2?'negative':'positive'}">${val(p.qty)} un.</div><button class="secondary" data-move="${i}">Movimentar</button></div>`).join(''):`<div class="panel empty">Seu estoque está vazio.<br>Cadastre o primeiro produto para começar.</div>`;
      document.getElementById('cashList').innerHTML=state.cash.length?state.cash.slice().reverse().map((c,ri)=>{const i=state.cash.length-1-ri;return `<div class="row clickable" data-receipt="${i}"><div class="row-main"><div class="row-title">${esc(c.description)}</div><div class="row-meta">${esc(c.date)} · toque para ver o recibo</div></div><div class="qty ${c.type==='IN'?'positive':'negative'}">${c.type==='IN'?'+':'-'} ${money.format(val(c.amount))}</div></div>`}).join(''):`<div class="panel empty">Nenhum lançamento.<br>Registre vendas, recebimentos ou despesas.</div>`;
      document.getElementById('reportContent').innerHTML=`<h3>${esc(state.storeName||'Minha Loja')}</h3><p>Relatório de estoque e caixa</p><h3 class="sub-title">Resumo financeiro</h3><p>Entradas: <b>${money.format(t.income)}</b></p><p>Saídas: <b>${money.format(t.expense)}</b></p><p>Saldo: <b class="${t.balance>=0?'positive':'negative'}">${money.format(t.balance)}</b></p><h3 class="sub-title">Resumo do estoque</h3><p>Unidades: <b>${t.units}</b></p><p>Valor investido: <b>${money.format(t.stock)}</b></p><p>Produtos cadastrados: <b>${state.products.length}</b></p>${state.products.length?'<div class="report-line">'+state.products.map(p=>`• ${esc(p.name)}: ${val(p.qty)} unidade(s)`).join('\n')+'</div>':''}`;
      document.getElementById('lastReceipt').style.display=state.cash.length?'inline-block':'none';
    }
    function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')}
    function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
    function newProduct(){openModal(`<h2>Novo produto</h2><form id="productForm"><label>Nome do produto<input name="name" required></label><label>Código/SKU <span class="hint">(opcional)</span><input name="sku"></label><label>Quantidade inicial<input name="qty" type="number" min="0" value="0" required></label><label>Custo unitário (R$)<input name="cost" type="number" min="0" step="0.01" value="0"></label><label>Preço de venda (R$)<input name="price" type="number" min="0" step="0.01" value="0"></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.products.push({name:f.get('name').trim(),sku:f.get('sku').trim(),qty:val(f.get('qty')),cost:val(f.get('cost')),price:val(f.get('price'))});save();closeModal()}}
    function moveStock(i){const p=state.products[i];openModal(`<h2>Movimentar estoque</h2><p class="hint">${esc(p.name)} · estoque atual: ${p.qty}</p><form id="moveForm"><label>Tipo<select name="type"><option value="IN">Entrada</option><option value="OUT">Saída</option></select></label><label>Quantidade<input name="qty" type="number" min="1" value="1" required></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Aplicar</button></div></form>`);document.getElementById('moveForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),q=val(f.get('qty'));if(f.get('type')==='OUT'&&q>p.qty){alert('A saída não pode ser maior que o estoque.');return}p.qty+=f.get('type')==='IN'?q:-q;save();closeModal()}}
    function newCash(){openModal(`<h2>Novo lançamento</h2><form id="cashForm"><label>Tipo<select name="type"><option value="IN">Entrada</option><option value="OUT">Saída</option></select></label><label>Descrição<input name="description" placeholder="Ex.: Venda no balcão" required></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" required></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('cashForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.cash.push({type:f.get('type'),description:f.get('description').trim(),amount:val(f.get('amount')),date:new Date().toLocaleString('pt-BR')});save();closeModal()}}
    function receipt(i){const c=state.cash[i];if(!c)return;const inType=c.type==='IN';openModal(`<div class="receipt"><h2>${esc(state.storeName||'Minha Loja')}</h2><div class="muted">RECIBO DE LANÇAMENTO</div><hr><div class="detail"><b>Descrição:</b> ${esc(c.description)}<br><b>Tipo:</b> ${inType?'Entrada':'Saída'}<br><b>Data:</b> ${esc(c.date)}</div><div class="total ${inType?'positive':'negative'}">${inType?'+':'-'} ${money.format(val(c.amount))}</div><div class="muted">Obrigado!</div><div class="modal-actions"><button class="secondary" id="printReceipt">Imprimir</button><button class="primary" data-close>Fechar</button></div></div>`);document.getElementById('printReceipt').onclick=()=>window.print()}
    document.addEventListener('click',e=>{const view=e.target.dataset.view;if(view){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view))}if(e.target.matches('[data-action="new-product"]'))newProduct();if(e.target.matches('[data-action="new-cash"]'))newCash();if(e.target.matches('[data-close]'))closeModal();if(e.target.dataset.move!==undefined)moveStock(Number(e.target.dataset.move));if(e.target.closest('[data-receipt]'))receipt(Number(e.target.closest('[data-receipt]').dataset.receipt))});
    document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
    document.getElementById('editStore').onclick=()=>{const n=prompt('Nome da loja:',state.storeName||'Minha Loja');if(n&&n.trim()){state.storeName=n.trim();save()}};
    document.getElementById('logoInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{state.logo=r.result;save()};r.readAsDataURL(file)};
    document.getElementById('printReport').onclick=()=>window.print();document.getElementById('lastReceipt').onclick=()=>receipt(state.cash.length-1);
    render();
  </script>
</body>
</html>
